name: usecase32_marketing_swarm
tier: 3
description: |
  v2 §3.2 marketing fan-out — primitive-level CLI smoke for `fleetctl
  swarm`. This scenario verifies the CLI surface (help text, flag wiring,
  empty-target rejection) and ledger integrity after the surface is
  exercised. It does NOT exercise the real fan-out path — swarm has no
  --dry-run flag and requires live SSH targets to mutate; that live
  path is covered by the fleet-usecase-demos Layer 3 pass against real
  workers in the hermes-setup repo.

steps:
  # 1. Help text mentions every advertised swarm flag.
  - name: swarm-help-mentions-all
    run: bin/fleetctl swarm --help
    expect:
      exit: 0
      stdout_contains: "--all"

  - name: swarm-help-mentions-target
    run: bin/fleetctl swarm --help
    expect:
      exit: 0
      stdout_contains: "--target"

  - name: swarm-help-mentions-parallel
    run: bin/fleetctl swarm --help
    expect:
      exit: 0
      stdout_contains: "--parallel"

  - name: swarm-help-mentions-retry
    run: bin/fleetctl swarm --help
    expect:
      exit: 0
      stdout_contains: "--retry"

  # 2. Empty target set without --all / --target rejects with a clear
  # error and exit 1 (cobra's default for RunE errors). The previous
  # `|| true` masked the real exit code and made this step a no-op.
  - name: swarm-rejects-empty-targets
    run: bin/fleetctl swarm --cmd "uptime"
    expect:
      exit: 1
      stderr_contains: "--all or one or more --target are required"

  # 3. Ledger remains signature-valid before/after the swarm CLI surface
  # was exercised. (No mutating swarm ran, so VerifyAll must still succeed.)
  - name: ledger-verify-clean
    run: bin/fleetctl ledger verify
    expect:
      exit: 0
