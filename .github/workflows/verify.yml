name: verify

# WS-12 Phase-1 verification gate. The static-and-self-tests half of the
# QVE runbook. The live-fleet half (real workers, real SSH) lives in
# hermes-setup as the fleet-usecase-* skills.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: fleetctl verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `fleetctl verify` itself runs go build, go vet, go test -race,
      # and gen-skills --check as shell-out checks (see
      # internal/verify.DefaultChecks). Running them as separate workflow
      # steps would double the CI wall time. Keep a single build step
      # only to fail fast with a clear "go build" status if the binary
      # itself doesn't compile.
      - name: go build ./...
        run: go build ./...

      - name: fleetctl verify --json
        run: go run ./cmd/fleetctl verify --json | tee verify.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: verify.json
